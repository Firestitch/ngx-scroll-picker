<div
    class="scroll-container"
    tabindex="0"
    role="listbox"
    [attr.aria-activedescendant]="value"
    #scrollContainer>
  <div class="selection"></div>
  <!--
    Gives the drum its width. Every .value row is absolutely positioned inside
    the 3D transform, so the drum has no intrinsic width of its own; this row
    is the one thing in normal flow, and it holds the longest label so the
    browser measures the real rendered text rather than the width being
    guessed from a character count.
  -->
  <div class="sizer" aria-hidden="true">
    @for (item of sizerItems; track item.value) {
      <div class="sizer-row">
        @if (template) {
          <ng-container
              [ngTemplateOutlet]="template"
              [ngTemplateOutletContext]="{ value: item, $implicit: item }">
          </ng-container>
        } @else {
          {{item.name}}
        }
      </div>
    }
  </div>

  <div class="scroller" [style.transform]="'translateZ(' + -radius + 'px)'">
    <div class="values">
      @for (slot of slots; track slot.key) {
        <div
            class="value"
            role="option"
            [attr.aria-selected]="slot.selected"
            [style.transform]="'rotateX(' + slot.angle + 'deg) translateZ(' + radius + 'px) scale(' + slot.scale + ')'"
            [style.opacity]="slot.opacity"
            [style.visibility]="slot.hidden ? 'hidden' : 'visible'"
            [ngClass]="{ disabled: slot.disabled, selected: slot.selected }"
            (click)="slotClick(slot)">
          @if (slot.item) {
            @if (template) {
              <ng-container
                  [ngTemplateOutlet]="template"
                  [ngTemplateOutletContext]="{ value: slot.item, $implicit: slot.item }">
              </ng-container>
            } @else {
              {{slot.item.name}}
            }
          }
        </div>
      }
    </div>
  </div>
</div>
