<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Picker tick tuner</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body { font: 15px/1.5 -apple-system, system-ui, sans-serif; margin: 0;
         padding: 16px 16px 80px; background: #111; color: #eee; }
  h1 { font-size: 17px; margin: 0 0 2px; }
  p.sub { margin: 0 0 16px; color: #999; font-size: 13px; }
  .preset { border: 1px solid #333; border-radius: 10px; padding: 12px 14px;
            margin-bottom: 10px; background: #1a1a1a; }
  .preset h2 { font-size: 14px; margin: 0 0 3px; }
  .preset .d { color: #999; font-size: 12.5px; margin: 0 0 10px; }
  button { font: inherit; font-size: 14px; padding: 10px 14px; margin: 0 6px 6px 0;
           cursor: pointer; background: #2a2a2a; color: #eee; border: 1px solid #444;
           border-radius: 8px; -webkit-tap-highlight-color: transparent; }
  button.go { background: #2d4a2d; border-color: #3d6a3d; }
  .tuner { border: 1px solid #3a3a5a; border-radius: 10px; padding: 12px 14px;
           background: #16161f; margin: 18px 0 10px; }
  .row { display: flex; align-items: center; gap: 10px; margin-bottom: 9px; }
  .row label { flex: 0 0 116px; font-size: 12.5px; color: #bbb; }
  .row input { flex: 1; min-width: 0; }
  .row output { flex: 0 0 62px; text-align: right; font-family: ui-monospace, monospace;
                font-size: 12.5px; color: #6ec96e; }
  #dump { width: 100%; height: 130px; margin-top: 10px; background: #000; color: #9cdcfe;
          border: 1px solid #333; border-radius: 8px; padding: 10px;
          font-family: ui-monospace, monospace; font-size: 11.5px; }
  .warn { color: #e6c07b; font-size: 12.5px; }
</style>

<h1>Picker tick tuner</h1>
<p class="sub">Unmute the phone first (physical switch). Tap a preset, or tune by hand
below and send me the numbers.</p>

<div id="presets"></div>

<div class="tuner">
  <h2 style="font-size:14px;margin:0 0 8px">Tune by hand</h2>
  <div id="sliders"></div>
  <button class="go" id="playCustom">Play run</button>
  <button id="single">Single</button>
  <button id="copy">Show values</button>
  <textarea id="dump" readonly placeholder="Tap 'Show values' and paste the result back to me."></textarea>
</div>

<p class="warn">On a real iPhone most of the picker feel is the Taptic Engine, not sound.
A web page can't reproduce that on iOS — so this will always be an approximation.</p>

<script>
let ctx = null;
function ensure() {
  if (!ctx) {
    const C = window.AudioContext || window.webkitAudioContext;
    ctx = new C({ latencyHint: 'interactive' });
    if (navigator.audioSession) { navigator.audioSession.type = 'ambient'; }
  }
  if (ctx.state !== 'running') { ctx.resume().catch(() => {}); }
  return ctx;
}

const FLOOR = 0.0001;

// The shipping defaults.
const base = {
  tickDuration: 0.012,
  bodyStart: 2600, bodyEnd: 1500, bodySweep: 0.004,
  bodyGain: 0.18, bodyAttack: 0.0005, bodyDecay: 0.009,
  clickFreq: 4200, clickQ: 0.9, clickNoise: 0.006,
  clickGain: 0.85, clickDecay: 0.004,
  busHighpass: 900, tickGain: 0.25,
};

// Render one tick offline with the given params, return an AudioBuffer.
async function render(p) {
  const OC = window.OfflineAudioContext || window.webkitOfflineAudioContext;
  const sr = ensure().sampleRate;
  const off = new OC(1, Math.ceil(sr * p.tickDuration), sr);

  const bus = off.createBiquadFilter();
  bus.type = 'highpass';
  bus.frequency.value = p.busHighpass;
  bus.connect(off.destination);

  if (p.bodyGain > 0.001) {
    const o = off.createOscillator(), g = off.createGain();
    o.type = 'sine';
    o.frequency.setValueAtTime(p.bodyStart, 0);
    o.frequency.exponentialRampToValueAtTime(p.bodyEnd, p.bodySweep);
    g.gain.setValueAtTime(FLOOR, 0);
    g.gain.exponentialRampToValueAtTime(p.bodyGain, p.bodyAttack);
    g.gain.exponentialRampToValueAtTime(FLOOR, p.bodyDecay);
    o.connect(g); g.connect(bus);
    o.start(0); o.stop(p.tickDuration);
  }

  if (p.clickGain > 0.001) {
    const n = Math.ceil(sr * p.clickNoise);
    const buf = off.createBuffer(1, n, sr);
    const d = buf.getChannelData(0);
    for (let i = 0; i < n; i++) { d[i] = Math.random() * 2 - 1; }
    const s = off.createBufferSource(), b = off.createBiquadFilter(), g = off.createGain();
    s.buffer = buf;
    b.type = 'bandpass'; b.frequency.value = p.clickFreq; b.Q.value = p.clickQ;
    g.gain.setValueAtTime(p.clickGain, 0);
    g.gain.exponentialRampToValueAtTime(FLOOR, p.clickDecay);
    s.connect(b); b.connect(g); g.connect(bus);
    s.start(0);
  }

  return off.startRendering();
}

function play(buf, gain, when, jitter) {
  const s = ctx.createBufferSource(), g = ctx.createGain();
  s.buffer = buf;
  s.playbackRate.value = 1 + (Math.random() * 2 - 1) * (jitter ?? 0.03);
  g.gain.value = gain;
  s.connect(g); g.connect(ctx.destination);
  s.start(when);
  s.onended = () => { s.disconnect(); g.disconnect(); };
}

async function run(p, count, gap) {
  ensure();
  const buf = await render(p);
  const t0 = ctx.currentTime + 0.06;
  for (let i = 0; i < count; i++) { play(buf, p.tickGain, t0 + i * gap); }
}

// ---- Presets ---------------------------------------------------------------
const presets = [
  { name: 'A — Shipping now (retuned bright)', d: '12ms, click at 4.2kHz, body 2.6→1.5kHz, highpass 900Hz.',
    p: {} },
  { name: 'B — Brighter still', d: 'Click at 5.5kHz, highpass 1.5kHz. If A is still too low.',
    p: { clickFreq: 5500, busHighpass: 1500, bodyStart: 3200, bodyEnd: 2000 } },
  { name: 'C — Very bright, very short', d: '7ms, click at 6.5kHz. The extreme end — nearly all air.',
    p: { tickDuration: 0.007, clickFreq: 6500, clickNoise: 0.004, clickDecay: 0.0025,
         bodyGain: 0.10, bodyDecay: 0.005, busHighpass: 2000 } },
  { name: 'D — Pure noise, no body', d: 'Body off entirely. Just a bright filtered transient.',
    p: { bodyGain: 0, clickFreq: 4800, clickGain: 0.95, tickDuration: 0.009,
         clickDecay: 0.003, busHighpass: 1200 } },
  { name: 'E — Narrow band "tk"', d: 'High Q at 3.8kHz — more pitched, more plasticky.',
    p: { clickQ: 3.0, clickFreq: 3800, bodyGain: 0.12, busHighpass: 1000 } },
  { name: 'F — Two-layer bright', d: 'Bright click plus an audible high body. Slightly fuller.',
    p: { clickFreq: 4600, bodyStart: 3400, bodyEnd: 2400, bodyGain: 0.30,
         tickDuration: 0.014, busHighpass: 1100 } },
  { name: 'OLD — the low one you rejected', d: 'The previous thumpy version, for comparison only.',
    p: { tickDuration: 0.035, bodyStart: 320, bodyEnd: 180, bodySweep: 0.020,
         bodyGain: 0.50, bodyDecay: 0.028, clickFreq: 2200, clickQ: 1.2,
         clickNoise: 0.012, clickGain: 0.60, clickDecay: 0.008, busHighpass: 120 } },
];

const wrap = document.getElementById('presets');
presets.forEach((pre) => {
  const p = { ...base, ...pre.p };
  const card = document.createElement('div');
  card.className = 'preset';
  const h = document.createElement('h2'); h.textContent = pre.name;
  const d = document.createElement('p'); d.className = 'd'; d.textContent = pre.d;
  const one = document.createElement('button');
  one.textContent = 'Single';
  one.onclick = () => run(p, 1, 0);
  const slow = document.createElement('button');
  slow.className = 'go'; slow.textContent = 'Slow scroll';
  slow.onclick = () => run(p, 10, 0.16);
  const fast = document.createElement('button');
  fast.textContent = 'Fast flick';
  fast.onclick = () => run(p, 16, 0.032);
  const load = document.createElement('button');
  load.textContent = 'Load into tuner';
  load.onclick = () => { setAll(p); };
  card.append(h, d, one, slow, fast, load);
  wrap.appendChild(card);
});

// ---- Sliders ---------------------------------------------------------------
const specs = [
  ['bodyStart',   'Body from Hz',  200, 6000, 100],
  ['bodyEnd',     'Body to Hz',    120, 4000, 100],
  ['bodySweep',   'Sweep s',     0.001, 0.03, 0.001],
  ['bodyGain',    'Body gain',       0, 1.0, 0.02],
  ['bodyDecay',   'Body decay s',0.003, 0.04, 0.001],
  ['clickFreq',   'Click Hz',      800, 9000, 100],
  ['clickQ',      'Click Q',       0.3, 5.0, 0.1],
  ['clickNoise',  'Noise len s', 0.002, 0.02, 0.001],
  ['clickGain',   'Click gain',      0, 1.0, 0.05],
  ['clickDecay',  'Click decay s',0.001, 0.015, 0.0005],
  ['busHighpass', 'Highpass Hz',   100, 4000, 100],
  ['tickDuration','Total len s',  0.005, 0.05, 0.001],
  ['tickGain',    'Output gain',  0.02, 0.6, 0.01],
];

const custom = { ...base };
const sliders = {};
const host = document.getElementById('sliders');

specs.forEach(([key, label, min, max, step]) => {
  const row = document.createElement('div'); row.className = 'row';
  const l = document.createElement('label'); l.textContent = label;
  const i = document.createElement('input');
  i.type = 'range'; i.min = min; i.max = max; i.step = step; i.value = custom[key];
  const o = document.createElement('output'); o.textContent = custom[key];
  i.addEventListener('input', () => {
    custom[key] = parseFloat(i.value);
    o.textContent = i.value;
  });
  sliders[key] = { input: i, out: o };
  row.append(l, i, o);
  host.appendChild(row);
});

function setAll(p) {
  Object.keys(sliders).forEach((k) => {
    if (p[k] === undefined) { return; }
    custom[k] = p[k];
    sliders[k].input.value = p[k];
    sliders[k].out.textContent = p[k];
  });
}

document.getElementById('playCustom').onclick = () => run(custom, 10, 0.16);
document.getElementById('single').onclick = () => run(custom, 1, 0);
document.getElementById('copy').onclick = () => {
  document.getElementById('dump').value = specs
    .map(([k]) => k + ' = ' + custom[k])
    .join('\n');
};
</script>
